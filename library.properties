name=ErdiLRF
version=0.1.0
author=ERDI Technology (Chengdu)
maintainer=ERDI Technology (Chengdu)
sentence=Driver for ERDI 905 nm laser rangefinder modules over UART.
paragraph=Supports both published ERDI protocol families: the 8-byte 55 AA command/response protocol (LR/LRF-A1/SPD1200 series) and the free-running 5C data-frame protocol (LRF-H and LRF-VB series). Works with HardwareSerial or SoftwareSerial. Every constant is transcribed from the manufacturer manual; per-model units are respected (the VB series reports millimetres, the H series centimetres).
